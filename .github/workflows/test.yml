name: Test

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run tests
        run: python -m unittest discover -v
      - name: Compile
        run: python -m py_compile download.py download_with_aria.py test_*.py
      - name: Lint and format
        run: |
          ruff check download.py download_with_aria.py test_*.py
          ruff format --check download.py download_with_aria.py test_*.py
      - name: Security scan
        run: bandit --quiet --recursive download.py download_with_aria.py

  live-civitai:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install aria2 and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes aria2
          python -m pip install --requirement requirements.txt
      - name: Require the integration credential
        env:
          CIVITAI_TOKEN: ${{ secrets.CIVITAI_TOKEN }}
        run: test -n "$CIVITAI_TOKEN"
      - name: Download and verify the live CivitAI fixture
        env:
          CIVITAI_INTEGRATION: "1"
          CIVITAI_TOKEN: ${{ secrets.CIVITAI_TOKEN }}
        run: python -m unittest -v test_integration_civitai
